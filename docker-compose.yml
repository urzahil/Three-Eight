services:
  three-eight:
    build: .
    image: three-eight:latest
    pull_policy: build   # local image only: never try to pull it from Docker Hub
    container_name: three-eight
    restart: unless-stopped
    ports:
      # Bound to this machine only: suits a reverse proxy on the same host (it forwards to 127.0.0.1:4567).
      # For a proxy in another container, put both on a shared Docker network and drop "ports" instead of
      # publishing the port. Publish it on all interfaces ("4567:4567") only if nothing sits in front.
      - "127.0.0.1:4567:4567"
    environment:
      # Password for https://<your-host>/admin (required).
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      # The app runs behind a TLS reverse proxy (needed for camera/mic access). Keep "true" only while the app is
      # reachable solely through that proxy (see "ports"): otherwise clients could forge X-Forwarded-For.
      # (A number instead of "true" means that many proxies in a row, e.g. "2" for CDN + reverse proxy.)
      TRUST_PROXY: "true"
      # Max participants per room (default 12). Each person sends video to everyone else, so >8 gets heavy.
      MAX_ROOM_SIZE: ${MAX_ROOM_SIZE:-12}
      # Optional TURN relay for friends behind very strict NATs (see README).
      TURN_URLS: ${TURN_URLS:-}
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_PASSWORD: ${TURN_PASSWORD:-}
      # Optional Google Drive folders for rooms (see README): path of the service account's JSON key
      # inside the container. Uncomment the volume below and set
      # GOOGLE_SERVICE_ACCOUNT=/run/secrets/google-service-account.json in .env.
      GOOGLE_SERVICE_ACCOUNT: ${GOOGLE_SERVICE_ACCOUNT:-}
      # Memory for the server's movie cache while streaming from Drive, in MB (minimum 32).
      DRIVE_CACHE_MB: ${DRIVE_CACHE_MB:-256}
    volumes:
      - three-eight-data:/data
      # The service account key file downloaded from Google Cloud, mounted read-only. Keep it private:
      # it can read whatever is shared with that service account.
      # - ./google-service-account.json:/run/secrets/google-service-account.json:ro

  # Optional TURN relay (coturn) for friends whose network blocks direct connections, typically mobile
  # data (4G/5G) and some corporate networks. To use it:
  #   1. Uncomment the service below.
  #   2. In .env set TURN_SECRET (a long random string), TURN_REALM (the TURN host name) and TURN_URLS
  #      (see .env.example). Three-Eight hands out short-lived logins derived from TURN_SECRET.
  #   3. Point a DNS name (e.g. turn.example.com) at this machine and open in the firewall:
  #      3478/udp+tcp, 5349/tcp (TURN over TLS) and the relay range 49160-49200/udp.
  #   4. Put a certificate for that name in ./turn-certs (fullchain.pem, privkey.pem), readable by the
  #      container's user (coturn runs as "nobody"). Needed for turns:, which gets through networks that
  #      block UDP. Without one, drop the --cert/--pkey/--tls-listening-port lines and the turns: URL.
  #   5. If this machine is behind NAT (e.g. a home server), uncomment --external-ip.
  # It uses the host network: coturn must see the real ports, and Docker's port mapping is very slow
  # for a large UDP range.
  # turn:
  #   image: coturn/coturn:4.6
  #   container_name: three-eight-turn
  #   restart: unless-stopped
  #   network_mode: host
  #   volumes:
  #     - ./turn-certs:/certs:ro
  #   command:
  #     - -n                                   # no config file: everything is below
  #     - --log-file=stdout
  #     - --realm=${TURN_REALM:?Set TURN_REALM in .env}
  #     - --use-auth-secret                    # time-limited logins issued by Three-Eight
  #     - --static-auth-secret=${TURN_SECRET:?Set TURN_SECRET in .env}
  #     - --listening-port=3478
  #     - --tls-listening-port=5349
  #     - --cert=/certs/fullchain.pem
  #     - --pkey=/certs/privkey.pem
  #     - --no-tlsv1
  #     - --no-tlsv1_1
  #     - --min-port=49160                     # relay ports: keep in sync with the firewall
  #     - --max-port=49200
  #     # - --external-ip=PUBLIC_IP/PRIVATE_IP  # only behind NAT, e.g. 203.0.113.5/192.168.1.10
  #     - --fingerprint
  #     - --no-cli
  #     - --no-multicast-peers
  #     # Relay only to the internet: never into this machine or its private network.
  #     - --denied-peer-ip=0.0.0.0-0.255.255.255
  #     - --denied-peer-ip=10.0.0.0-10.255.255.255
  #     - --denied-peer-ip=100.64.0.0-100.127.255.255
  #     - --denied-peer-ip=127.0.0.0-127.255.255.255
  #     - --denied-peer-ip=169.254.0.0-169.254.255.255
  #     - --denied-peer-ip=172.16.0.0-172.31.255.255
  #     - --denied-peer-ip=192.0.0.0-192.0.0.255
  #     - --denied-peer-ip=192.168.0.0-192.168.255.255
  #     - --denied-peer-ip=198.18.0.0-198.19.255.255
  #     - --denied-peer-ip=::1
  #     - --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
  #     - --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
  #     - --user-quota=12                      # simultaneous relays per login
  #     - --total-quota=100
  #     # Bandwidth, in BYTES per second (each direction counted separately). A session is one relayed link between
  #     # two friends (camera, screen and movie pieces): 2000000 = 16 Mbit/s, more than a 1080p film needs.
  #     # bps-capacity is the total for all sessions: set it a little below what this machine's connection carries
  #     # (12500000 = 100 Mbit/s), so leaked credentials cannot saturate it.
  #     - --max-bps=2000000
  #     - --bps-capacity=12500000

volumes:
  three-eight-data:
