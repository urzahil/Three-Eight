services:
  three-eight:
    build: .
    image: three-eight:latest
    pull_policy: build   # local image only: never try to pull it from Docker Hub
    container_name: three-eight
    restart: unless-stopped
    ports:
      - "4567:4567"
    environment:
      # Password for https://<your-host>/admin (required).
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      # The app runs behind a TLS reverse proxy (needed for camera/mic access).
      TRUST_PROXY: "true"
      # Max participants per room (default 12). Each person sends video to everyone else, so >8 gets heavy.
      MAX_ROOM_SIZE: ${MAX_ROOM_SIZE:-12}
      # Optional TURN relay for friends behind very strict NATs (see README).
      TURN_URLS: ${TURN_URLS:-}
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_PASSWORD: ${TURN_PASSWORD:-}
      # Optional Google Drive folders for rooms (see README): path of the service account's JSON key
      # inside the container. Uncomment the volume below and set
      # GOOGLE_SERVICE_ACCOUNT=/run/secrets/google-service-account.json in .env.
      GOOGLE_SERVICE_ACCOUNT: ${GOOGLE_SERVICE_ACCOUNT:-}
      # Memory for the server's movie cache while streaming from Drive, in MB.
      DRIVE_CACHE_MB: ${DRIVE_CACHE_MB:-256}
    volumes:
      - three-eight-data:/data
      # The service account key file downloaded from Google Cloud, mounted read-only. Keep it private:
      # it can read whatever is shared with that service account.
      # - ./google-service-account.json:/run/secrets/google-service-account.json:ro

volumes:
  three-eight-data:
